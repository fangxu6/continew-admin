openapi: 3.0.3
info:
  title: WMS模块API
  description: 仓库管理系统模块API接口文档
  version: 1.0.0
  contact:
    name: ContiNew Admin 开发团队
    email: contact@continew.top

servers:
  - url: http://localhost:8080
    description: 开发环境

tags:
  - name: 基础数据管理
    description: 物品、位置、供应商、客户等基础数据管理
  - name: 入库作业
    description: 入库订单、收货等入库相关操作
  - name: 出库作业
    description: 出库订单、发货等出库相关操作
  - name: 库存管理
    description: 库存查询、盘点、调整等库存相关操作
  - name: 库内作业
    description: 库内转移、调拨等内部作业操作
  - name: 报表分析
    description: 各类报表和分析数据

paths:
  # 基础数据管理接口
  /wms/item:
    post:
      tags:
        - 基础数据管理
      summary: 创建物品
      description: 创建新的物品信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - 基础数据管理
      summary: 分页查询物品
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: true
          schema:
            type: integer
            default: 10
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageItemResp'

  /wms/item/{id}:
    get:
      tags:
        - 基础数据管理
      summary: 根据ID查询物品
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseItemDetailResp'
    put:
      tags:
        - 基础数据管理
      summary: 更新物品
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemReq'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - 基础数据管理
      summary: 删除物品
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /wms/location:
    post:
      tags:
        - 基础数据管理
      summary: 创建位置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - 基础数据管理
      summary: 分页查询位置
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: true
          schema:
            type: integer
            default: 10
        - name: warehouseId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageLocationResp'

  # 入库作业接口
  /wms/receipt:
    post:
      tags:
        - 入库作业
      summary: 创建入库订单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptOrderReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /wms/receipt/{orderNo}:
    get:
      tags:
        - 入库作业
      summary: 根据订单号查询入库订单
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReceiptOrderDetailResp'

  # 出库作业接口
  /wms/dispatch:
    post:
      tags:
        - 出库作业
      summary: 创建出库订单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchOrderReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /wms/dispatch/{orderNo}:
    get:
      tags:
        - 出库作业
      summary: 根据订单号查询出库订单
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDispatchOrderDetailResp'

  # 库存管理接口
  /wms/inventory/by-item/{itemId}:
    get:
      tags:
        - 库存管理
      summary: 根据物品ID查询库存
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListInventoryResp'

  /wms/inventory/by-location/{locationId}:
    get:
      tags:
        - 库存管理
      summary: 根据位置ID查询库存
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListInventoryResp'

  # 报表分析接口
  /wms/report/inventory:
    get:
      tags:
        - 报表分析
      summary: 库存报表
      parameters:
        - name: warehouseId
          in: query
          required: false
          schema:
            type: integer
        - name: itemId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListInventoryReportResp'

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          description: 响应码
          example: 200
        message:
          type: string
          description: 响应消息
          example: "操作成功"
        data:
          type: object
          description: 响应数据
      required:
        - code
        - message

    ApiResponsePageItemResp:
      type: object
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PageRespItemResp'

    ApiResponseItemDetailResp:
      type: object
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ItemDetailResp'

    PageRespItemResp:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ItemResp'
        total:
          type: integer
          description: 总记录数
        size:
          type: integer
          description: 每页大小
        current:
          type: integer
          description: 当前页
        pages:
          type: integer
          description: 总页数

    ItemResp:
      type: object
      properties:
        id:
          type: integer
          description: 物品ID
        code:
          type: string
          description: 物品编码
        name:
          type: string
          description: 物品名称
        category:
          type: string
          description: 物品类别
        unit:
          type: string
          description: 计量单位
        status:
          type: string
          description: 物品状态

    ItemDetailResp:
      type: object
      properties:
        id:
          type: integer
          description: 物品ID
        code:
          type: string
          description: 物品编码
        name:
          type: string
          description: 物品名称
        description:
          type: string
          description: 物品描述
        category:
          type: string
          description: 物品类别
        unit:
          type: string
          description: 计量单位
        length:
          type: number
          description: 长度
        width:
          type: number
          description: 宽度
        height:
          type: number
          description: 高度
        weight:
          type: number
          description: 重量
        status:
          type: string
          description: 物品状态

    ItemReq:
      type: object
      properties:
        code:
          type: string
          description: 物品编码
          example: "ITEM001"
        name:
          type: string
          description: 物品名称
          example: "笔记本电脑"
        description:
          type: string
          description: 物品描述
        category:
          type: string
          description: 物品类别
        unit:
          type: string
          description: 计量单位
        length:
          type: number
          description: 长度
        width:
          type: number
          description: 宽度
        height:
          type: number
          description: 高度
        weight:
          type: number
          description: 重量
        status:
          type: string
          description: 物品状态
      required:
        - code
        - name
        - unit

    LocationReq:
      type: object
      properties:
        code:
          type: string
          description: 位置编码
          example: "A-01-01"
        name:
          type: string
          description: 位置名称
          example: "A区01排01位"
        warehouseId:
          type: integer
          description: 所属仓库ID
        area:
          type: string
          description: 所属区域
        row:
          type: string
          description: 排
        column:
          type: string
          description: 列
        level:
          type: string
          description: 层
        position:
          type: string
          description: 位
        type:
          type: string
          description: 位置类型
        capacity:
          type: number
          description: 容量
        status:
          type: string
          description: 位置状态
      required:
        - code
        - name
        - warehouseId

    ReceiptOrderReq:
      type: object
      properties:
        orderNo:
          type: string
          description: 订单号
        supplierId:
          type: integer
          description: 供应商ID
        type:
          type: string
          description: 入库类型
        remark:
          type: string
          description: 备注
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptOrderItemReq'
      required:
        - orderNo
        - supplierId

    ReceiptOrderItemReq:
      type: object
      properties:
        itemId:
          type: integer
          description: 物品ID
        quantity:
          type: number
          description: 数量
        unitPrice:
          type: number
          description: 单价
      required:
        - itemId
        - quantity

    DispatchOrderReq:
      type: object
      properties:
        orderNo:
          type: string
          description: 订单号
        customerId:
          type: integer
          description: 客户ID
        type:
          type: string
          description: 出库类型
        remark:
          type: string
          description: 备注
        items:
          type: array
          items:
            $ref: '#/components/schemas/DispatchOrderItemReq'
      required:
        - orderNo
        - customerId

    DispatchOrderItemReq:
      type: object
      properties:
        itemId:
          type: integer
          description: 物品ID
        quantity:
          type: number
          description: 数量
      required:
        - itemId
        - quantity

    ApiResponsePageLocationResp:
      type: object
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PageRespLocationResp'

    PageRespLocationResp:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/LocationResp'
        total:
          type: integer
          description: 总记录数
        size:
          type: integer
          description: 每页大小
        current:
          type: integer
          description: 当前页
        pages:
          type: integer
          description: 总页数

    LocationResp:
      type: object
      properties:
        id:
          type: integer
          description: 位置ID
        code:
          type: string
          description: 位置编码
        name:
          type: string
          description: 位置名称
        warehouseId:
          type: integer
          description: 所属仓库ID
        type:
          type: string
          description: 位置类型
        status:
          type: string
          description: 位置状态

    ApiResponseReceiptOrderDetailResp:
      type: object
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ReceiptOrderDetailResp'

    ReceiptOrderDetailResp:
      type: object
      properties:
        id:
          type: integer
          description: 订单ID
        orderNo:
          type: string
          description: 订单号
        supplierId:
          type: integer
          description: 供应商ID
        supplierName:
          type: string
          description: 供应商名称
        type:
          type: string
          description: 入库类型
        status:
          type: string
          description: 订单状态
        totalAmount:
          type: number
          description: 总金额
        remark:
          type: string
          description: 备注
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptOrderItemResp'

    ReceiptOrderItemResp:
      type: object
      properties:
        itemId:
          type: integer
          description: 物品ID
        itemName:
          type: string
          description: 物品名称
        quantity:
          type: number
          description: 数量
        unitPrice:
          type: number
          description: 单价

    ApiResponseDispatchOrderDetailResp:
      type: object
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DispatchOrderDetailResp'

    DispatchOrderDetailResp:
      type: object
      properties:
        id:
          type: integer
          description: 订单ID
        orderNo:
          type: string
          description: 订单号
        customerId:
          type: integer
          description: 客户ID
        customerName:
          type: string
          description: 客户名称
        type:
          type: string
          description: 出库类型
        status:
          type: string
          description: 订单状态
        totalAmount:
          type: number
          description: 总金额
        remark:
          type: string
          description: 备注
        items:
          type: array
          items:
            $ref: '#/components/schemas/DispatchOrderItemResp'

    DispatchOrderItemResp:
      type: object
      properties:
        itemId:
          type: integer
          description: 物品ID
        itemName:
          type: string
          description: 物品名称
        quantity:
          type: number
          description: 数量

    ApiResponseListInventoryResp:
      type: object
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/InventoryResp'

    InventoryResp:
      type: object
      properties:
        id:
          type: integer
          description: 库存ID
        itemId:
          type: integer
          description: 物品ID
        itemName:
          type: string
          description: 物品名称
        locationId:
          type: integer
          description: 位置ID
        locationName:
          type: string
          description: 位置名称
        quantity:
          type: number
          description: 总数量
        availableQuantity:
          type: number
          description: 可用数量
        reservedQuantity:
          type: number
          description: 预留数量
        frozenQuantity:
          type: number
          description: 冻结数量
        batchNumber:
          type: string
          description: 批次号
        expiryDate:
          type: string
          format: date
          description: 过期日期

    ApiResponseListInventoryReportResp:
      type: object
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/InventoryReportResp'

    InventoryReportResp:
      type: object
      properties:
        itemId:
          type: integer
          description: 物品ID
        itemName:
          type: string
          description: 物品名称
        totalQuantity:
          type: number
          description: 总库存量
        availableQuantity:
          type: number
          description: 可用库存量
        reservedQuantity:
          type: number
          description: 预留库存量
        frozenQuantity:
          type: number
          description: 冻结库存量
        warehouseId:
          type: integer
          description: 仓库ID
        warehouseName:
          type: string
          description: 仓库名称